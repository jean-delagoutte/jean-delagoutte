    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // Decodes the path 404.html encoded into the query string (see its
      // own comment) back into a real path via history.replaceState, so
      // React Router (BrowserRouter) sees the correct URL once it mounts.
      // Must run before anything reads location.pathname.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
