<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Jean DELAGOUTTE - CV</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side rewrite: a direct hit or refresh on
      // a real path like /resume returns this 404 page instead of the app.
      // This redirects back to / with the intended path encoded in the
      // query string; index.html's own inline script (see its <head>)
      // decodes it back into a real path via history.replaceState before
      // the app mounts, so React Router ends up routing correctly.
      var pathSegmentsToKeep = 0; // hosted at the domain root (CNAME), not a /repo-name/ subpath

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
